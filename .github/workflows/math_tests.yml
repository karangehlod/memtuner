name: Math Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  math-correctness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Visualization dependency smoke test
        run: python -c "from benchmark.reporting.study_visualizer import _require_matplotlib; _require_matplotlib()"

      - name: Math correctness tests
        run: python -m pytest tests/unit/test_math_correctness.py -v --tb=short
